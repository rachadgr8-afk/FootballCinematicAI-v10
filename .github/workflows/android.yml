name: Build Android APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install web dependencies
        run: npm ci --legacy-peer-deps

      - name: TypeScript and web lint
        run: npm run lint

      - name: Verify Python CPU pipeline
        run: |
          python3 -m pip install --upgrade pip
          python3 -m pip install -r requirements-cpu.txt
          python3 scripts/verify_cpu_torch.py
          python3 -m py_compile main.py yolo/*.py tests/*.py

      - name: Guard server route contract
        run: python3 tests/test_server_routes.py

      - name: Build web app
        env:
          VITE_API_BASE_URL: https://footballcinematicai-v10.onrender.com
        run: npm run build

      - name: Sync Capacitor Android
        run: npx cap sync android

      - name: Build Debug APK
        working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon

      - name: Build Release APK
        working-directory: android
        run: ./gradlew assembleRelease --no-daemon

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballCinematicAI-v10-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: FootballCinematicAI-v10-release-apk
          path: android/app/build/outputs/apk/release/app-release-unsigned.apk
          if-no-files-found: error

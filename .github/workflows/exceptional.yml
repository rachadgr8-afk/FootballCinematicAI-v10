name: Exceptional CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python-quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install CPU Python stack
        run: pip install -r requirements.txt
      - name: Verify CPU Torch
        run: python -c "import torch; assert '+cpu' in torch.__version__; assert torch.cuda.is_available() is False; print(torch.__version__)"
      - name: Compile and tests
        run: |
          python -m py_compile main.py yolo/*.py tests/*.py
          python tests/selftest.py
          # Regression guard: fails if server.ts was truncated or lost a route
          # the frontend calls (the 2026-09-27 outage cause).
          python tests/test_server_routes.py

  android:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - run: npm ci --legacy-peer-deps
      - run: npm run lint
      - run: npm run build
        env:
          VITE_API_BASE_URL: https://footballcinematicai-v10.onrender.com
      - run: npx cap sync android
      - working-directory: android
        run: chmod +x gradlew && ./gradlew assembleDebug --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: FootballCinematicAI-EXCEPTIONAL-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
